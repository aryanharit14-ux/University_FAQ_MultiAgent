<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - University FAQ</title>
</head>
<body>
    <h1>Sign Up</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.signup') }}">
        <label>Name</label><br>
        <input type="text" name="name" required><br><br>

        <label>Email</label><br>
        <input type="email" name="email" required><br><br>

        <label>Roll Number</label><br>
        <input type="text" name="roll_number"><br><br>

        <label>Password</label><br>
        <input type="password" name="password" required minlength="6"><br><br>

        <label>Confirm Password</label><br>
        <input type="password" name="confirm_password" required minlength="6"><br><br>

        <button type="submit">Sign Up</button>
    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</body>
</html>
